.native-app-list{display:flex;flex-direction:column;gap:5px;overflow:auto;min-height:80px;max-height:calc(100% - 220px);padding-right:2px}
.native-app-row{display:flex;align-items:center;gap:11px;padding:9px;border:1px solid transparent;border-radius:11px;min-width:0}
.native-app-row:hover{background:var(--panel-soft);border-color:var(--line)}
.native-app-row .native-app-icon,.native-app-row img,.native-app-row .native-app-fallback{width:38px;height:38px}
.native-app-row .native-app-meta{min-width:0;flex:1}
.native-app-row .native-app-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.native-app-row .native-app-package{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.native-app-row .md-btn{flex:0 0 auto}
.native-status{padding:10px;border-radius:10px;background:var(--panel-soft);color:var(--muted);font-size:12px;line-height:1.5;margin-bottom:8px}
@media(max-width:520px){.native-app-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.native-app-row{gap:8px;padding:7px}.native-app-row .native-app-package{max-width:150px}}

</head>
<body>
<div id="os-container" class="theme-root">
  <div id="wallpaper" class="wallpaper" data-wallpaper="aurora" aria-hidden="true"></div>
  <main id="desktop-area" aria-label="Desktop MateDesk" tabindex="-1">
    <div id="desktop-icons" aria-label="Ikon desktop"></div>
    <div id="window-layer" aria-live="off"></div>
  </main>
  <section id="start-menu" aria-label="Menu Start" aria-hidden="true">
    <div class="start-top"><h2>Semua aplikasi</h2><span class="subtle">MateDesk</span></div>
    <label class="search-box"><span id="start-search-icon"></span><input id="app-search" type="search" placeholder="Cari aplikasi, berkas, dan lainnya" autocomplete="off" aria-label="Cari aplikasi"></label>
    <div class="start-section-head"><span>Aplikasi MateDesk</span><span id="start-count">7 aplikasi</span></div>
    <div class="start-grid" id="start-grid"></div>
    <div class="start-section-head" id="native-app-section-head" hidden><span>Aplikasi Android terpasang</span><button type="button" class="subtle-button" id="refresh-native-apps">Muat ulang</button></div>
    <div class="start-grid native-app-grid" id="native-app-grid" hidden></div>
    <div class="start-section-head"><span>Direkomendasikan</span><span class="subtle">Lokal</span></div>
    <div id="start-recommended"></div>
    <div class="start-footer"><div class="profile-chip"><div class="avatar">M</div><span>Pengguna MateDesk</span></div><button class="task-btn" id="start-power" title="Info sesi" aria-label="Info sesi"><span id="power-icon"></span></button></div>
  </section>
  <section id="quick-panel" aria-label="Panel cepat">
    <div class="quick-top"><div><h3>Pengaturan cepat</h3><div class="subtle" id="quick-long-date">—</div></div><button class="task-btn" id="quick-close" aria-label="Tutup panel">×</button></div>
    <div class="quick-tiles"><button class="quick-tile" data-quick="theme"><span id="quick-theme-icon"></span><span id="quick-theme-label">Tema gelap</span></button><button class="quick-tile" data-quick="wallpaper"><span id="quick-wall-icon"></span><span>Personalisasi</span></button><button class="quick-tile" data-quick="files"><span id="quick-files-icon"></span><span>File Manager</span></button><button class="quick-tile" data-quick="desktop"><span id="quick-desktop-icon"></span><span>Tampilkan desktop</span></button></div>
    <div class="quick-foot"><span>MateDesk Pro</span><span>Desktop lokal</span></div>
  </section>
  <nav id="taskbar" aria-label="Taskbar">
    <div class="taskbar-section taskbar-left"><button class="task-btn" id="start-button" aria-label="Buka Start" title="Start"><span class="start-logo"><i></i><i></i><i></i><i></i></span></button></div>
    <div class="taskbar-section taskbar-apps" id="taskbar-apps"></div>
    <div class="taskbar-section taskbar-right"><button class="task-btn clock-btn" id="clock-button" aria-label="Tanggal, waktu dan pengaturan cepat"><span class="clock-time" id="clock-time">00.00</span><span class="clock-date" id="clock-date">29/10/2026</span></button></div>
  </nav>
  <div id="context-menu" role="menu"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>
<script>
(() => {
  'use strict';
  const $ = (s, root=document) => root.querySelector(s);
  const $$ = (s, root=document) => [...root.querySelectorAll(s)];
  const STORAGE = {theme:'matedesk.theme', wallpaper:'matedesk.wallpaper', icons:'matedesk.icons', note:'matedesk.note', layouts:'matedesk.layouts'};
  const safeGet = (key, fallback=null) => { try { const v=localStorage.getItem(key); return v===null?fallback:v; } catch { return fallback; } };
  const safeSet = (key, value) => { try { localStorage.setItem(key, value); return true; } catch { return false; } };
  const icons = {
    files:'<path d="M3.5 6.5A2.5 2.5 0 0 1 6 4h4l2 2h6a2 2 0 0 1 2 2v9.5a2.5 2.5 0 0 1-2.5 2.5h-11A3 3 0 0 1 3.5 17z"/><path d="M3.5 9h17l-2 8.5a2 2 0 0 1-2 1.5"/>',
    notes:'<path d="M6 3.5h9l4 4v13H6a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2z"/><path d="M14.5 3.5v4h4M8 12h8M8 15.5h8"/>',
    calculator:'<rect x="4.5" y="2.5" width="15" height="19" rx="2.2"/><path d="M8 6.5h8M8 11h1M12 11h1M16 11h.1M8 15h1M12 15h1M16 15h.1M8 18.5h1M12 18.5h1M16 18.5h.1"/>',
    settings:'<circle cx="12" cy="12" r="3.2"/><path d="m19.4 15 .1.1a1.8 1.8 0 1 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3 .9v.2a1.8 1.8 0 1 1-3.6 0v-.2a1.8 1.8 0 0 0-3-.9l-.1.1a1.8 1.8 0 1 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-.9-3H3.7a1.8 1.8 0 1 1 0-3.6h.2a1.8 1.8 0 0 0 .9-3l-.1-.1a1.8 1.8 0 1 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3-.9v-.2a1.8 1.8 0 1 1 3.6 0v.2a1.8 1.8 0 0 0 3 .9l.1-.1a1.8 1.8 0 1 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 .9 3h.2a1.8 1.8 0 1 1 0 3.6h-.2a1.8 1.8 0 0 0-.9 3z"/>',
    browser:'<circle cx="12" cy="12" r="9"/><path d="M3.5 9h17M3.5 15h17M12 3c2.4 2.5 3.5 5.5 3.5 9S14.4 18.5 12 21M12 3C9.6 5.5 8.5 8.5 8.5 12S9.6 18.5 12 21"/>',
    help:'<circle cx="12" cy="12" r="9"/><path d="M9.6 9a2.5 2.5 0 1 1 4.3 1.7c-1.2 1.1-1.9 1.4-1.9 3M12 17.5h.01"/>',
    apps:'<rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1.2"/><rect x="14" y="3.5" width="6.5" height="6.5" rx="1.2"/><rect x="3.5" y="14" width="6.5" height="6.5" rx="1.2"/><rect x="14" y="14" width="6.5" height="6.5" rx="1.2"/>' ,
    search:'<circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4 4"/>',
    power:'<path d="M12 2.5v9"/><path d="M7 5.5a8 8 0 1 0 10 0"/>',
    refresh:'<path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9a7 7 0 0 1 11.8-2L20 12M4 12l2.6 5a7 7 0 0 0 11.8-2"/>',
    desktop:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',
    moon:'<path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z"/>',
    sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    close:'<path d="m6 6 12 12M18 6 6 18"/>',
    minimize:'<path d="M5 12h14"/>',
    maximize:'<rect x="5" y="5" width="14" height="14" rx="1"/>',
    restore:'<path d="M8 8V5a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-3"/><rect x="4" y="8" width="12" height="12" rx="1"/>',
    download:'<path d="M12 3v12m-5-5 5 5 5-5M4 19v2h16v-2"/>',
    folder:'<path d="M3 6.5A2.5 2.5 0 0 1 5.5 4H10l2 2h6.5A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/>',
    file:'<path d="M6 3h8l4 4v14H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M14 3v5h5M8 13h8M8 16h8"/>',
    external:'<path d="M14 4h6v6M20 4 10 14"/><path d="M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/>',
    check:'<path d="m5 12 4 4L19 6"/>',
    more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'
  };
  const svg = (name, cls='') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.help}</svg>`;
  const APPS = [
    {id:'files',name:'File Manager',short:'Berkas',desc:'Jelajahi berkas lokal',icon:'files',glyph:'glyph-files'},
    {id:'notes',name:'Notes',short:'Catatan',desc:'Catatan tersimpan otomatis',icon:'notes',glyph:'glyph-notes'},
    {id:'calculator',name:'Calculator',short:'Kalkulator',desc:'Hitung dengan cepat',icon:'calculator',glyph:'glyph-calculator'},
    {id:'browser',name:'Browser',short:'Browser',desc:'Buka halaman web',icon:'browser',glyph:'glyph-browser'},
    {id:'settings',name:'Settings',short:'Pengaturan',desc:'Personalisasi MateDesk',icon:'settings',glyph:'glyph-settings'},
    {id:'androidapps',name:'Aplikasi Android',short:'Aplikasi',desc:'Buka aplikasi yang terpasang',icon:'apps',glyph:'glyph-androidapps',desktop:false},
    {id:'about',name:'Tentang MateDesk',short:'Tentang',desc:'Informasi aplikasi',icon:'help',glyph:'glyph-help'}
  ];
  const defaultPositions = {files:{x:.025,y:.035},notes:{x:.025,y:.19},calculator:{x:.025,y:.345},browser:{x:.025,y:.50},settings:{x:.025,y:.655},about:{x:.025,y:.81}};
  let preferences = {theme:safeGet(STORAGE.theme,'dark'),wallpaper:safeGet(STORAGE.wallpaper,'aurora')};
  let iconPositions = (()=>{try{return {...defaultPositions,...JSON.parse(safeGet(STORAGE.icons,'{}'))};}catch{return {...defaultPositions};}})();
  let savedLayouts = (()=>{try{return JSON.parse(safeGet(STORAGE.layouts,'{}'))||{};}catch{return {};}})();
  let windows = [];
  let nextWindowId = 1;
  let zCounter = 200;
  let activeWindowId = null;
  let selectedDesktopIcon = null;
  let lastIconTap = {id:null,time:0};
  let toastTimer = null;
  const fileSelections = new Map();
  const objectUrls = new Set();
  let installedAndroidApps = [];
  let nativeDeviceCapabilities = null;
  const winLayer = $('#window-layer');
  const desktopIcons = $('#desktop-icons');
  const startMenu = $('#start-menu');
  const contextMenu = $('#context-menu');
  const quickPanel = $('#quick-panel');

  function appById(id){return APPS.find(a=>a.id===id)||APPS[0];}
  function glyph(app, extra=''){return `<span class="app-glyph ${app.glyph} ${extra}">${svg(app.icon)}</span>`;}
  function savePreferences(){safeSet(STORAGE.theme,preferences.theme);safeSet(STORAGE.wallpaper,preferences.wallpaper);safeSet(STORAGE.icons,JSON.stringify(iconPositions));safeSet(STORAGE.layouts,JSON.stringify(savedLayouts));}
  function showToast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200);}
  function applyTheme(){document.body.classList.toggle('light-mode',preferences.theme==='light');$('#quick-theme-label').textContent=preferences.theme==='dark'?'Tema gelap':'Tema terang';$('#quick-theme-icon').innerHTML=svg(preferences.theme==='dark'?'moon':'sun');$('#quick-wall-icon').innerHTML=svg('settings');$('#quick-files-icon').innerHTML=svg('files');$('#quick-desktop-icon').innerHTML=svg('desktop');$('#start-search-icon').innerHTML=svg('search');$('#power-icon').innerHTML=svg('power');}
  function applyWallpaper(){ $('#wallpaper').dataset.wallpaper=preferences.wallpaper; savePreferences(); }
  function renderDesktopIcons(){
    desktopIcons.innerHTML='';
    APPS.filter(app=>app.desktop!==false).forEach(app=>{
      const pos=iconPositions[app.id]||defaultPositions[app.id];
      const btn=document.createElement('button');btn.className='desktop-icon'+(selectedDesktopIcon===app.id?' selected':'');btn.type='button';btn.dataset.app=app.id;btn.setAttribute('aria-label',app.name);btn.style.left=`${Math.max(0,Math.min(.88,pos.x))*100}%`;btn.style.top=`${Math.max(0,Math.min(.82,pos.y))*100}%`;
      btn.innerHTML=`${glyph(app)}<span class="label"></span>`;$('.label',btn).textContent=app.name;
      let startX=0,startY=0,originX=0,originY=0,moved=false;
      btn.addEventListener('pointerdown',e=>{if(e.button!==0)return;startX=e.clientX;startY=e.clientY;originX=btn.offsetLeft;originY=btn.offsetTop;moved=false;btn.setPointerCapture?.(e.pointerId);});
      btn.addEventListener('pointermove',e=>{if(!(e.buttons&1)||!btn.hasPointerCapture?.(e.pointerId))return;const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.abs(dx)>5||Math.abs(dy)>5)moved=true;if(moved){btn.style.left=`${Math.max(0,Math.min(desktopIcons.clientWidth-88,originX+dx))}px`;btn.style.top=`${Math.max(0,Math.min(desktopIcons.clientHeight-94,originY+dy))}px`;}});
      btn.addEventListener('pointerup',()=>{if(moved){const x=btn.offsetLeft/Math.max(1,desktopIcons.clientWidth);const y=btn.offsetTop/Math.max(1,desktopIcons.clientHeight);iconPositions[app.id]={x:Math.max(0,Math.min(.88,x)),y:Math.max(0,Math.min(.82,y))};savePreferences();btn.dataset.justDragged='1';setTimeout(()=>delete btn.dataset.justDragged,80);}});
      btn.addEventListener('click',e=>{if(btn.dataset.justDragged)return;selectedDesktopIcon=app.id;$$('.desktop-icon',desktopIcons).forEach(i=>i.classList.toggle('selected',i.dataset.app===app.id));const now=Date.now();if(e.detail>=2||(lastIconTap.id===app.id&&now-lastIconTap.time<430)){openApp(app.id);lastIconTap={id:null,time:0};}else{lastIconTap={id:app.id,time:now};}});
      btn.addEventListener('dblclick',e=>{e.preventDefault();openApp(app.id);});
      btn.addEventListener('contextmenu',e=>{e.preventDefault();selectedDesktopIcon=app.id;renderDesktopIcons();showContextMenu(e.clientX,e.clientY,[{label:'Buka',icon:'external',action:()=>openApp(app.id)},{label:'Personalisasi',icon:'settings',action:()=>openApp('settings')}]);});
      desktopIcons.appendChild(btn);
    });
  }
  function isNativeBridgeAvailable(){return !!(window.MateDeskAndroid&&typeof window.MateDeskAndroid.getInstalledApps==='function'&&typeof window.MateDeskAndroid.launchAndroidApp==='function');}
  function nativeAppLabel(app){return String(app.label||app.name||app.packageName||'Aplikasi Android');}
  function makeNativeIcon(app, className='native-app-icon'){
    if(app.iconDataUri){const img=document.createElement('img');img.className=className;img.alt='';img.loading='lazy';img.src=app.iconDataUri;img.addEventListener('error',()=>{const fallback=document.createElement('span');fallback.className='native-app-fallback';fallback.textContent=nativeAppLabel(app).slice(0,1).toUpperCase();img.replaceWith(fallback);},{once:true});return img;}
    const fallback=document.createElement('span');fallback.className='native-app-fallback';fallback.textContent=nativeAppLabel(app).slice(0,1).toUpperCase();return fallback;
  }
  function launchNativeApp(packageName, preferWindow=false){
    if(!isNativeBridgeAvailable()){showToast('Fitur ini memerlukan APK MateDesk di Android.');return;}
    const app=installedAndroidApps.find(a=>a.packageName===packageName);if(!app){showToast('Aplikasi tidak ditemukan. Muat ulang daftar aplikasi.');return;}
    try{const accepted=window.MateDeskAndroid.launchAndroidApp(packageName,!!preferWindow);if(accepted){showToast('Meminta sistem membuka '+nativeAppLabel(app)+'…');closeStart();quickPanel.classList.remove('open');}else{showToast('Aplikasi tidak dapat diluncurkan oleh sistem.');}}catch(e){showToast('Gagal meminta peluncuran aplikasi.');}
  }
  window.MateDeskNativeLaunchResult=function(packageName,success,message){const app=installedAndroidApps.find(a=>a.packageName===packageName);const name=app?nativeAppLabel(app):packageName;showToast(message||(success?('Permintaan membuka '+name+' berhasil dikirim.'):('Gagal membuka '+name+'.')));};
  function refreshAndroidApps(silent=true){
    if(!isNativeBridgeAvailable()){
      installedAndroidApps=[];nativeDeviceCapabilities=null;
    }else{
      try{const raw=window.MateDeskAndroid.getInstalledApps();const parsed=JSON.parse(raw||'[]');installedAndroidApps=Array.isArray(parsed)?parsed.filter(a=>a&&typeof a.packageName==='string'&&a.packageName.trim()).sort((a,b)=>nativeAppLabel(a).localeCompare(nativeAppLabel(b),'id')):[];nativeDeviceCapabilities=typeof window.MateDeskAndroid.getWindowingCapabilities==='function'?JSON.parse(window.MateDeskAndroid.getWindowingCapabilities()||'{}'):null;}
      catch(e){installedAndroidApps=[];if(!silent)showToast('Daftar aplikasi Android tidak dapat dibaca.');}
    }
    renderStartItems($('#app-search')?.value||'');
    $$('[data-native-app-manager]').forEach(manager=>renderNativeAppsInManager(manager));
    if(!silent)showToast(isNativeBridgeAvailable()?`${installedAndroidApps.length} aplikasi yang dapat diluncurkan ditemukan.`:'Buka MateDesk melalui APK Android untuk mendeteksi aplikasi.');
    return installedAndroidApps.length;
  }
  window.MateDeskRefreshAndroidApps=function(){refreshAndroidApps(true);};
  function renderNativeAppsInManager(manager){
    if(!manager)return;
    const list=$('[data-native-app-list]',manager),status=$('[data-native-app-status]',manager),search=$('[data-native-app-search]',manager),preferWindow=$('[data-native-window-mode]',manager)?.checked||false;
    if(!list||!status)return;
    const query=(search?.value||'').trim().toLowerCase();
    list.innerHTML='';
    if(!isNativeBridgeAvailable()){
      status.textContent='Deteksi aplikasi Android hanya tersedia setelah MateDesk dikemas dan dibuka sebagai APK. Preview HTML tidak mempunyai izin untuk membaca daftar aplikasi perangkat.';
      return;
    }
    const deviceLabel=nativeDeviceCapabilities?`${nativeDeviceCapabilities.manufacturer||'Perangkat'} ${nativeDeviceCapabilities.model||''}`.trim():'Perangkat Android';const freeformLabel=nativeDeviceCapabilities?(nativeDeviceCapabilities.freeformAdvertised?'API Android melaporkan dukungan freeform':(nativeDeviceCapabilities.pictureInPictureAdvertised?'PiP terdeteksi; dukungan freeform belum tentu tersedia':'API Android tidak melaporkan freeform/PiP')):'dukungan jendela belum terdeteksi';status.textContent=`${installedAndroidApps.length} aplikasi yang dapat diluncurkan. ${deviceLabel} · ${freeformLabel}. Sistem tetap dapat mengabaikan petunjuk ukuran jendela.`;
    const apps=installedAndroidApps.filter(a=>(nativeAppLabel(a)+' '+a.packageName).toLowerCase().includes(query));
    const count=$('[data-native-count]',manager);if(count)count.textContent=`${apps.length} aplikasi`;
    if(!apps.length){list.innerHTML='<div class="empty-state">Tidak ada aplikasi yang cocok dengan pencarian.</div>';return;}
    apps.forEach(app=>{
      const row=document.createElement('div');row.className='native-app-row';
      row.appendChild(makeNativeIcon(app));
      const meta=document.createElement('div');meta.className='native-app-meta';
      const name=document.createElement('div');name.className='native-app-name';name.textContent=nativeAppLabel(app);
      const pkg=document.createElement('div');pkg.className='native-app-package';pkg.textContent=app.packageName;
      meta.append(name,pkg);row.appendChild(meta);
      const button=document.createElement('button');button.type='button';button.className='md-btn primary';button.textContent='Buka';button.addEventListener('click',()=>launchNativeApp(app.packageName,preferWindow));row.appendChild(button);
      list.appendChild(row);
    });
  }
  function renderStartItems(query=''){
    const normalized=String(query||'').trim().toLowerCase();
    const grid=$('#start-grid');grid.innerHTML='';
    const filtered=APPS.filter(a=>(a.name+' '+a.desc+' '+a.short).toLowerCase().includes(normalized));
    filtered.forEach(app=>{const b=document.createElement('button');b.className='start-app';b.type='button';b.innerHTML=`${glyph(app)}<span></span>`;b.querySelector('span:last-child').textContent=app.name;b.addEventListener('click',()=>{closeStart();openApp(app.id);});grid.appendChild(b);});
    const nativeHead=$('#native-app-section-head'),nativeGrid=$('#native-app-grid');
    const nativeMatches=installedAndroidApps.filter(a=>(nativeAppLabel(a)+' '+a.packageName).toLowerCase().includes(normalized));
    const nativeVisible=isNativeBridgeAvailable();nativeHead.hidden=!nativeVisible;nativeGrid.hidden=!nativeVisible;nativeGrid.innerHTML='';
    if(nativeVisible){
      if(!nativeMatches.length){const empty=document.createElement('div');empty.className='empty-state';empty.textContent=normalized?'Tidak ada aplikasi Android yang cocok.':'Tidak ada aplikasi yang dapat diluncurkan.';nativeGrid.appendChild(empty);}
      nativeMatches.slice(0,36).forEach(app=>{const b=document.createElement('button');b.className='native-app-tile';b.type='button';b.title=`${nativeAppLabel(app)} (${app.packageName})`;b.appendChild(makeNativeIcon(app));const label=document.createElement('span');label.className='native-app-label';label.textContent=nativeAppLabel(app);b.appendChild(label);b.addEventListener('click',()=>launchNativeApp(app.packageName,false));nativeGrid.appendChild(b);});
    }
    $('#start-count').textContent=`${filtered.length+nativeMatches.length} aplikasi`;
    const rec=$('#start-recommended');rec.innerHTML='';
    const recommended=(normalized?filtered:APPS.filter(a=>a.id!=='androidapps').slice(0,2));
    if(!recommended.length){rec.innerHTML='<div class="empty-state">Tidak ada aplikasi MateDesk yang cocok. Lihat bagian Aplikasi Android jika tersedia.</div>';return;}
    recommended.slice(0,4).forEach(app=>{const b=document.createElement('button');b.className='file-row';b.type='button';b.innerHTML=`<span class="file-symbol">${svg(app.icon)}</span><span class="file-meta"><span class="file-name"></span><span class="file-size"></span></span>`;$('.file-name',b).textContent=app.name;$('.file-size',b).textContent=app.desc;b.addEventListener('click',()=>{closeStart();openApp(app.id);});rec.appendChild(b);});

  function formatNumber(n){return Number.isInteger(n)?String(n):String(Number(n.toPrecision(11)));}
  function formatBytes(n){if(!Number.isFinite(n)||n<0)return 'Ukuran tidak diketahui';if(n<1024)return `${n} B`;const u=['KB','MB','GB','TB'];let i=-1;do{n/=1024;i++;}while(n>=1024&&i<u.length-1);return `${n.toFixed(n>=100?0:n>=10?1:2)} ${u[i]}`;}
  function downloadText(filename,text,mime){if(window.MateDeskAndroid&&typeof window.MateDeskAndroid.saveTextFile==='function'){window.MateDeskAndroid.saveTextFile(filename,text,mime||'text/plain');return;}const blob=new Blob([text],{type:mime});const url=URL.createObjectURL(blob);objectUrls.add(url);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>{URL.revokeObjectURL(url);objectUrls.delete(url);},1000);}
  function openLocalFile(file){try{const url=URL.createObjectURL(file);objectUrls.add(url);const opened=window.open(url,'_blank');if(opened){try{opened.opener=null;}catch{}}else{const a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();showToast('Pratinjau diblokir; berkas diunduh bila didukung.');}setTimeout(()=>{URL.revokeObjectURL(url);objectUrls.delete(url);},60000);}catch{showToast('Berkas tidak dapat dibuka di browser ini.');}}
  function showContextMenu(x,y,items){contextMenu.innerHTML='';items.forEach(item=>{if(item.separator){const sep=document.createElement('div');sep.className='menu-sep';contextMenu.appendChild(sep);return;}const b=document.createElement('button');b.type='button';b.setAttribute('role','menuitem');b.innerHTML=`${svg(item.icon||'help')}<span></span>`;$('span',b).textContent=item.label;b.addEventListener('click',()=>{contextMenu.classList.remove('open');item.action?.();});contextMenu.appendChild(b);});contextMenu.classList.add('open');contextMenu.style.left=`${Math.min(x,window.innerWidth-220)}px`;contextMenu.style.top=`${Math.min(y,window.innerHeight-contextMenu.offsetHeight-12)}px`;}
  function hideContextMenu(){contextMenu.classList.remove('open');}

  $('#start-button').addEventListener('click',e=>{e.stopPropagation();toggleStart();hideContextMenu();});$('#app-search').addEventListener('input',e=>renderStartItems(e.target.value));$('#refresh-native-apps')?.addEventListener('click',()=>refreshAndroidApps(false));$('#clock-button').addEventListener('click',e=>{e.stopPropagation();toggleQuick();hideContextMenu();});$('#quick-close').addEventListener('click',()=>quickPanel.classList.remove('open'));
  $$('[data-quick]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.quick;if(k==='theme'){preferences.theme=preferences.theme==='dark'?'light':'dark';applyTheme();savePreferences();}else if(k==='wallpaper'){openApp('settings');}else if(k==='files'){openApp('files');}else if(k==='desktop'){windows.forEach(w=>{w.minimized=true;updateWindowElement(w);});activeWindowId=null;renderTaskbar();}quickPanel.classList.remove('open');}));
  $('#start-power').addEventListener('click',()=>showToast('MateDesk berjalan sebagai aplikasi preview.'));
  $('#desktop-area').addEventListener('contextmenu',e=>{if(e.target.closest('.desktop-icon')||e.target.closest('.app-window'))return;e.preventDefault();showContextMenu(e.clientX,e.clientY,[{label:'Refresh desktop',icon:'refresh',action:()=>{renderDesktopIcons();showToast('Desktop diperbarui.');}},{label:'Urutkan ikon',icon:'desktop',action:()=>{iconPositions=JSON.parse(JSON.stringify(defaultPositions));savePreferences();renderDesktopIcons();}},{separator:true},{label:'Personalisasi',icon:'settings',action:()=>openApp('settings')},{label:'Buka File Manager',icon:'files',action:()=>openApp('files')}]);});
  $('#desktop-area').addEventListener('click',e=>{if(!e.target.closest('.desktop-icon')){selectedDesktopIcon=null;$$('.desktop-icon').forEach(i=>i.classList.remove('selected'));}});
  document.addEventListener('pointerdown',e=>{if(!e.target.closest('#context-menu'))hideContextMenu();if(!e.target.closest('#start-menu')&&!e.target.closest('#start-button')){startMenu.classList.remove('open');startMenu.setAttribute('aria-hidden','true');}if(!e.target.closest('#quick-panel')&&!e.target.closest('#clock-button'))quickPanel.classList.remove('open');});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideContextMenu();closeStart();quickPanel.classList.remove('open');return;}if(e.altKey&&e.key==='F4'&&activeWindowId!==null){e.preventDefault();closeWindow(activeWindowId);return;}if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='n'){e.preventDefault();openApp('notes');}if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='e'){e.preventDefault();openApp('files');}if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='c'){e.preventDefault();openApp('calculator');}});
  window.addEventListener('resize',()=>{renderDesktopIcons();windows.forEach(w=>{if(w.maximized){updateWindowElement(w);}else{w.x=Math.max(0,Math.min(w.x,$('#desktop-area').clientWidth-w.w));w.y=Math.max(0,Math.min(w.y,$('#desktop-area').clientHeight-w.h));updateWindowElement(w);}});saveWindowLayouts();});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')renderTaskbar();});
  applyTheme();applyWallpaper();renderDesktopIcons();refreshAndroidApps(true);renderStartItems('');renderTaskbar();setInterval(renderTaskbar,15000);
})();
</script>
</body>
</html>
